# SkyWatch DEV — infrastructure only (runs in a VM).
# The code (connector, consumer, API, dashboard) runs on the host
# and reaches these services through forwarded ports (127.0.0.1).
#
#   cp .env.example .env   # KAFKA_EXTERNAL_HOST=127.0.0.1
#   docker compose -f docker-compose.dev.yml up -d

services:
  # ── Kafka in KRaft mode (no ZooKeeper: since Kafka 3.x an external coordinator is not needed) ──
  # Official apache/kafka image (bitnami/* images were removed from Docker Hub in 2025).
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller   # single node = both broker and controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      #
      # PITFALL #1: the broker has TWO listeners.
      # INTERNAL — for containers inside the docker network (kafka:9092),
      # EXTERNAL — for code on the host (through port forwarding = 127.0.0.1:29092).
      # Kafka gives the client its advertised address; if that address is
      # unreachable, the client hangs.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      #
      # Single-broker cluster: replication factor 1.
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created explicitly only
      #
      # Data directory (matches the volume below); CLUSTER_ID — any valid
      # base64 uuid, pinned so the storage format is reproducible.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # In dev the topics are created MANUALLY (see kafka/create-topics.sh for the reference);
  # in prod a one-shot kafka-init container does it (docker-compose.prod.yml).

  # Web UI: topics, messages, consumer groups, lag.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: skywatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP interface (and the /play web console)
    volumes:
      - ch_data:/var/lib/clickhouse
      # In dev the DB schema is applied MANUALLY (see clickhouse/init/01_schema.sql).
      # In prod the clickhouse/init/ directory is mounted into /docker-entrypoint-initdb.d
      # and runs automatically on the first start (docker-compose.prod.yml).
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      retries: 10

volumes:
  kafka_data:
  ch_data:
