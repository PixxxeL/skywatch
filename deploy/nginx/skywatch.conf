# Образец сайта для СИСТЕМНОГО nginx (не в докере).
# Положить в /etc/nginx/sites-available/skywatch, включить симлинком в sites-enabled.
# TLS: certbot --nginx после привязки домена — он сам допишет 443-блок.

server {
    listen 80;
    server_name _;            # или домен

    # Статика дашборда: собрать `npm run build` и выложить dist сюда
    root /var/www/skywatch;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA-роутинг
    }

    # API — в докере, опубликован только на локальной петле хоста
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
