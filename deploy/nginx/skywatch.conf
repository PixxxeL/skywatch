# Site template for the SYSTEM nginx (not dockerized).
# Put into /etc/nginx/sites-available/skywatch, enable with a symlink in sites-enabled.
# TLS: run `certbot --nginx` after pointing a domain here — it appends the 443 block itself.

server {
    listen 80;
    server_name _;            # or a domain

    # Dashboard static files: run `npm run build` and put dist here
    root /var/www/skywatch;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA routing
    }

    # API — dockerized, published only on the host loopback
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
