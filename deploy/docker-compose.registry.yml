# SkyWatch PROD (VDS) — same as docker-compose.prod.yml, but application images
# are pulled from GitHub Container Registry instead of being built on the server.
# Used by the CD pipeline (.github/workflows/deploy.yml).
#
#   cp .env.example .env   # production values, including GHCR_OWNER!
#   docker compose -f docker-compose.registry.yml up -d

services:
  # ── infrastructure (ports bound to the host's 127.0.0.1 or closed) ──
  # Official apache/kafka image (bitnami/* images were removed from Docker Hub in 2025).
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # In prod the only Kafka clients are the containers of this docker network (INTERNAL).
      # EXTERNAL is kept on the host loopback — for debugging from the VDS itself (kcat etc.).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # Default heap is 1G — far too much for this stream on a 2 GB VDS.
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    logging:
      options: { max-size: "50m", max-file: "3" }

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro

  # Not started by default (~350 MB of JVM). When needed:
  #   docker compose -f docker-compose.registry.yml --profile debug up -d kafka-ui
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["debug"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: skywatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xmx256m"
    ports:
      - "127.0.0.1:8085:8080"   # view from the VDS via an ssh tunnel: ssh -L 8085:127.0.0.1:8085
    restart: unless-stopped
    logging:
      options: { max-size: "20m", max-file: "2" }

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/zz-memory.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging:
      options: { max-size: "50m", max-file: "3" }

  # ── applications (images from ghcr.io, pushed by GitHub Actions) ──
  connector-ztf:
    image: ghcr.io/${GHCR_OWNER}/skywatch-connector-ztf:latest
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092    # inside the docker network — the internal listener
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      options: { max-size: "20m", max-file: "3" }

  consumer-alerts:
    image: ghcr.io/${GHCR_OWNER}/skywatch-consumer-alerts:latest
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options: { max-size: "20m", max-file: "3" }

  query-api:
    image: ghcr.io/${GHCR_OWNER}/skywatch-query-api:latest
    env_file: .env
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # for the host's system nginx
    restart: unless-stopped
    logging:
      options: { max-size: "20m", max-file: "3" }

volumes:
  kafka_data:
  ch_data:
