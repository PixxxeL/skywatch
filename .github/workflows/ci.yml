name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install common package
        run: pip install ./services/common
      - name: Install service dependencies
        run: >
          pip install
          -r services/connector-ztf/requirements.txt
          -r services/consumer-alerts/requirements.txt
          -r services/query-api/requirements.txt
      - name: Compile check
        run: python -m compileall -q services

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [connector-ztf, consumer-alerts, query-api]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile .
