[project]
name = "skywatch-common"
version = "0.0.1"
description = "SkyWatch shared code: settings, envelope, Avro"
requires-python = ">=3.12"
dependencies = ["fastavro>=1.9", "pydantic-settings>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skywatch_common*"]
